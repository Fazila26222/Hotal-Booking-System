<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Stayora</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="icons/bootstrap-icons.min.css">
</head>

<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-lg p-4" style="max-width: 450px; width: 100%; border-radius: 16px;">

            <div class="text-center mb-4">
                <h2 class="fw-bold" data-i18n="reset_title">Reset Password</h2>
                <p class="text-muted" data-i18n="reset_subtitle">Enter the code sent to your email and set a new
                    password.</p>
            </div>

            <form id="resetForm">
                <div class="form-group mb-3">
                    <label class="form-label" data-i18n="verify_code">Verification Code</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                        <input type="text" id="otpCode" class="form-control" data-i18n="code_ph"
                            placeholder="Enter 6-digit code" maxlength="6" required>
                    </div>
                </div>

                <div class="form-group mb-3">
                    <label class="form-label" data-i18n="new_pass">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" id="newPassword" class="form-control" data-i18n="new_pass_ph"
                            placeholder="New password" required>
                    </div>
                </div>

                <div class="form-group mb-3">
                    <label class="form-label" data-i18n="confirm_new_pass">Confirm New Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" id="confirmNewPassword" class="form-control"
                            data-i18n="confirm_new_pass_ph" placeholder="Confirm new password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2" data-i18n="reset_btn">Reset Password</button>
            </form>

            <div class="text-center mt-3">
                <a href="login.html" class="text-decoration-none" data-i18n="back_to_login">Back to Login</a>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
    
</body>
<script src="js/reset.js"></script>
</html>

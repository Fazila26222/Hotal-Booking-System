<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotal Booking System -Register</title>
    <!--css and bootstrap file-->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/register.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!--icons and fonts file-->
    <link rel="stylesheet" href="icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="icons/fonts/bootstrap-icons.woff">
    <link rel="stylesheet" href="fonts/Vazirmatn-Regular.ttf">
</head>

<body>
    <section class="register">
        <div class="container">
            <div class="row">
                <div class="col-lg-4">
                    <div class="register-label">
                        <span data-i18n="join_us">JOIN US</span>
                    </div>
                    <div class="register-head">
                        <h2 data-i18n="create_account">Create Your <br> Account</h2>
                        <p data-i18n="create_account_desc">Book your dream stay, manage your reservation and enjoy
                            exclusive offers.</p>
                    </div>
                    <div class="register-securty">
                        <h6><i class="bi bi-calendar-check"></i> <span data-i18n="easy_booking_feat">Easy Booking</span>
                        </h6>
                        <h6><i class="bi bi-star"></i> <span data-i18n="exclusive_offers">Exclusive Offers</span></h6>
                        <h6><i class="bi bi-headset"></i> <span data-i18n="support_247_feat">24/7 Support</span></h6>
                    </div>
                </div>

                <div class="col-lg-8">
                    <form id="registerForm">
                        <div class="card-register">
                            <div class="register-item">
                                <div class="register-icon">
                                    <i class="bi bi-person-fill"></i>
                                </div>
                                <div class="register-text">
                                    <h2 data-i18n="register_title">Register</h2>
                                    <p data-i18n="register_subtitle">Fill in the form below to create your account</p>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="input-box position-relative">
                                        <i
                                            class="bi bi-person position-absolute top-50 start-3 translate-middle-y ms-3"></i>
                                        <input type="text" id="registerName" class="form-control ps-5 text-start"
                                            data-i18n="full_name_ph" placeholder="Full Name *" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="input-box position-relative">
                                        <i
                                            class="bi bi-envelope position-absolute top-50 start-3 translate-middle-y ms-3"></i>
                                        <input type="email" id="registerEmail" class="form-control ps-5 text-start"
                                            data-i18n="email_ph" placeholder="Email Address *" required>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="input-box position-relative">
                                        <i
                                            class="bi bi-telephone position-absolute top-50 start-3 translate-middle-y ms-3"></i>
                                        <input type="tel" id="registerPhone" class="form-control ps-5 text-start"
                                            data-i18n="phone_ph" placeholder="Phone Number *" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="input-box position-relative">
                                        <i
                                            class="bi bi-lock-fill position-absolute top-50 start-3 translate-middle-y ms-3"></i>
                                        <input type="password" id="registerPassword"
                                            class="form-control ps-5 text-start" data-i18n="password_ph"
                                            placeholder="Password *" required>
                                    </div>
                                </div>
                            </div>
                            <div class="input-box position-relative">
                                <i class="bi bi-lock-fill position-absolute top-50 start-3 translate-middle-y ms-3"></i>
                                <input type="password" id="conformPassword" class="form-control ps-5 text-start"
                                    data-i18n="confirm_password_ph" placeholder="Confirm Password *" required>
                            </div>

                            <div class="input-box position-relative">
                                <i
                                    class="bi bi-person-badge position-absolute top-50 start-3 translate-middle-y ms-3"></i>
                                <select id="registerRole"
                                    class="form-select form-select-lg form-control ps-5 text-start">
                                    <option value="" selected disabled data-i18n="select_role">Select Role*</option>
                                    <option value="guest" data-i18n="role_guest">Guest</option>
                                    <option value="receptionist" data-i18n="role_receptionist">Receptionist</option>
                                    <option value="manager" data-i18n="role_manager">Manager</option>
                                    <option value="admin" data-i18n="role_admin">Admin</option>
                                </select>
                            </div>

                            <div class="input-box position-relative">
                                <i
                                    class="bi bi-geo-alt-fill position-absolute top-50 start-3 translate-middle-y ms-3"></i>
                                <input type="text" id="registerAddress" class="form-control ps-5 text-start"
                                    data-i18n="address_ph" placeholder="Address" required>
                            </div>

                            <div class="terms">
                                <input type="checkbox" id="terms">
                                <label for="terms" data-i18n="agree_terms">I agree to the Terms & Conditions</label>
                            </div>

                            <button type="submit" id="registerBtn" data-i18n="register_btn">Register</button>

                            <div class="login-line">
                                <span></span>
                                <p data-i18n="have_account">Already have an account?</p>
                                <span></span>
                            </div>
                            <a id="showLoginForm" href="login.html" data-i18n="login_here">Login here</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
    <script src="js/login.js"></script>
</body>
<script src="js/bootstrap.bundle.js"></script>
<script src="js/bootstrap.bundle.min.js"></script>

</html>

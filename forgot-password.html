<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Stayora</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="icons/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-lg p-4" style="max-width: 450px; width: 100%; border-radius: 16px;">
            <div class="text-center mb-4">
                <h2 class="fw-bold">Forgot Password?</h2>
                <p class="text-muted">Enter your email to receive a verification code.</p>
            </div>
            
            <form id="forgotForm">
                <div class="form-group mb-3">
                    <label class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="forgotEmail" class="form-control" placeholder="Enter your email" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Send Verification Code</button>
            </form>
            
            <div class="text-center mt-3">
                <a href="login.html" class="text-decoration-none">Back to Login</a>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/forgot.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotal Booking System - Login</title>
    <!--css and bootstrap file-->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!--icons and fonts file-->
    <link rel="stylesheet" href="icons/bootstrap-icons.min.css">
    <link rel="stylesheet" href="icons/fonts/bootstrap-icons.woff">
    <link rel="stylesheet" href="fonts/Vazirmatn-Regular.ttf">
</head>
 
<body>
    <div class="form-container">
        <h1>Stayora</h1>
        <div class="login-lable">
            <span>HOTEL & RESORT</span>
        </div>
        <H3>Welcome Back</H3>
        <p class="subtitle">Login to your account to continue</p>
        <form id="loginForm" class="auth-box">
            <div class="field">
                <input type="email" id="loginEmail" placeholder="Enter your email">
            </div>
            <div class="field">
                <input type="password" id="loginPassword" placeholder="Create your password">
            </div>
            <div class="terms">
                <input type="checkbox" id="terms">
                <label for="terms">
                    Remember me
                </label>
                <a href="forgot-password.html">Forgot password?</a>
            </div>
            <button type="submit" id="loginBtn">Login <i class="bi bi-arrow-right"></i></button>
            <div id="successMessage"></div>
            <div class="register-line">
                <span></span>
                <p>
                    Don't have an account
                </p>
                <span></span>
            </div>
            <a id="showRegisterForm" href="register.html">Register here</a>
        </form>
    </div>
    <script src="js/login.js"></script>
</body>
<script src="js/bootstrap.bundle.js"></script>
<script src="js/bootstrap.bundle.min.js"></script>

</html>
